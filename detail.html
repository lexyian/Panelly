<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>Series File — Panelly</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="detail.css">
</head>

<body class="detail-page">

  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-mark">P</span>
      <span class="brand-name">Panelly</span>
    </a>

    <nav class="desktop-nav">
      <a href="index.html">Home</a>
      <a href="index.html#browseSection">Browse</a>
      <a href="index.html#shelfSection">My Shelf</a>
    </nav>

    <form class="search-form" id="searchForm">
      <input
        type="search"
        id="searchInput"
        placeholder="Search a title..."
        autocomplete="off"
      >
      <button type="submit">Search</button>
    </form>
  </header>

  <main class="series-shell">

    <a class="series-back" href="index.html">
      ← Back to panels
    </a>

    <section class="series-file" id="detail">
      <div class="series-loading">
        Opening series file...
      </div>
    </section>

    <section class="chapter-zone">
      <div class="chapter-zone-heading">
        <div>
          <p class="section-kicker">READ ON PANELLY</p>
          <h2>Chapters</h2>
        </div>

        <span class="chapter-count" id="chapterCount">
          —
        </span>
      </div>

      <div class="chapter-list-new" id="chapterList">
        <div class="chapter-loading">
          Checking readable chapters...
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="footer-brand">
      <span class="footer-logo">Panelly</span>
      <span>Find your next panel.</span>
    </div>

    <p>
      Manga information and artwork provided by
      <a
        href="https://mangadex.org"
        target="_blank"
        rel="noopener noreferrer"
      >
        MangaDex
      </a>.
    </p>
  </footer>

  <nav class="mobile-nav">
    <a href="index.html">
      <span>⌂</span>
      <small>Home</small>
    </a>

    <a href="index.html#browseSection">
      <span>⌕</span>
      <small>Browse</small>
    </a>

    <a href="#chapterList">
      <span>▤</span>
      <small>Chapters</small>
    </a>

    <a href="index.html#shelfSection">
      <span>▣</span>
      <small>Shelf</small>
    </a>
  </nav>

  <script src="detail.js"></script>
</body>
</html>
