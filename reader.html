<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0b0b"
  >

  <title>Reader — Panelly</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <link
    rel="apple-touch-icon"
    href="apple-touch-icon.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body class="reader-body">

  <header class="reader-header">

    <a
      class="reader-back"
      id="backToSeries"
      href="index.html"
    >
      ← Series
    </a>

    <div class="reader-title-wrap">

      <strong id="readerTitle">
        Panelly Reader
      </strong>

      <span id="readerChapter">
        Loading chapter...
      </span>

    </div>

    <div class="reader-navigation">

      <a
        id="prevChapter"
        class="disabled"
        href="#"
      >
        ← Prev
      </a>

      <a
        id="nextChapter"
        class="disabled"
        href="#"
      >
        Next →
      </a>

    </div>

  </header>

  <div class="reader-progress-track">
    <div
      class="reader-progress"
      id="readerProgress"
    ></div>
  </div>

  <main>

    <div
      class="reader-status"
      id="readerStatus"
    >
      Loading chapter pages...
    </div>

    <div
      class="reader-pages"
      id="readerPages"
    ></div>

    <div class="reader-bottom">

      <a
        id="bottomPrev"
        href="#"
      >
        ← Previous Chapter
      </a>

      <span>
        END OF CHAPTER
      </span>

      <a
        id="bottomNext"
        href="#"
      >
        Next Chapter →
      </a>

    </div>

  </main>

  <script src="reader.js"></script>

</body>
</html>
